name: Build and Deploy Frontend to Prod Repo

on:
  push:
    branches:
      - master # Triggers when you push to your source repo's master branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      # Navigate into the frontend folder to build
      - name: Install and Build Frontend
        working-directory: ./frontendmanwha
        run: |
          npm ci
          npm run build

      # Push ONLY the dist folder to gittonyp/manwhaverse_on_github
      - name: Push to Prod Repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PROD_REPO_PAT }}
        with:
          # Pointing specifically to the build output inside your frontend folder
          source-directory: 'frontendmanwha/dist'
          
          # Your target details
          destination-github-username: 'gittonyp'
          destination-repository-name: 'manwhaverse_on_github'
          
          # The branch in your target repo (your previous terminal showed 'main')
          target-branch: 'main'
          
          user-email: github-actions[bot]@users.noreply.github.com
          commit-message: "Auto-deploy frontend (${{ github.sha }})"
