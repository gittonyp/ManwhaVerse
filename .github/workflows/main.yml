name: Build and Deploy Full Stack

on:
  push:
    branches:
      - master # Triggers on push to your source repo's master branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # ==========================================
      # FRONTEND: BUILD & PUSH
      # ==========================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      - name: Install and Build Frontend
        working-directory: ./frontendmanwha
        run: |
          npm ci
          npm run build

      - name: Push Frontend to GitHub Pages Repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PROD_REPO_PAT }}
        with:
          source-directory: 'frontendmanwha/dist'
          destination-github-username: 'gittonyp'
          destination-repository-name: 'manwhaverse_on_github'
          target-branch: 'main'
          user-email: github-actions[bot]@users.noreply.github.com
          commit-message: "Auto-deploy frontend (${{ github.sha }})"

      # ==========================================
      # BACKEND: BUILD & PUSH
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25' # Change to 21 if your project uses Java 21
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Backend
        working-directory: ./manwhaverse
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Deploy Backend to Docker Hosted Repo
        env:
          PROD_REPO_TOKEN: ${{ secrets.PROD_REPO_PAT }}
        run: |
          # 1. Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 2. Clone the target backend repository
          git clone https://x-access-token:${PROD_REPO_TOKEN}@github.com/gittonyp/manwhaverse-docker-hosted.git backend-repo
          
          # 3. Clean old jar and update with new files
          # This specifically protects your Dockerfile from being deleted
          rm -f backend-repo/*.jar
          
          # Copy the newly built jar
          cp manwhaverse/target/*.jar backend-repo/
          
          # Copy the SQLite database from your source repo
          cp manwhaverse/mangadb.db backend-repo/
          
          # 4. Commit and Push
          cd backend-repo
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No backend changes detected. Skipping push."
          else
            git commit -m "Auto-deploy backend jar and db (${{ github.sha }})"
            git push origin main
          fi
